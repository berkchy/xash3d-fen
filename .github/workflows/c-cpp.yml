name: Build & Deploy Engine
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            targetos: android
            targetarch: multiarch
          - os: windows-latest
            targetos: win32
            targetarch: amd64
          # always use the oldest possible for 32-bit because of older compilers,
          # and better support of certain legacy OSes
          - os: windows-2022
            targetos: win32
            targetarch: i386
    env:
      SDL_VERSION: 2.32.10
      # this engine revision supports ffmpeg 8.x (libavutil major 60). upstream has
      # since moved to 9.0 and bumped the SUPPORTED_* checks in avi_ffmpeg.h to
      # match, which is not backported here. deps_win32.sh skips ffmpeg when the
      # archive is unavailable, so the build below has no video support.
      FFMPEG_VERSION: "8.0"
      GH_CPU_ARCH: ${{ matrix.targetarch }}
      GH_CPU_OS: ${{ matrix.targetos }}
      GH_CROSSCOMPILING: ${{ matrix.cross }}
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        submodules: recursive
    - name: Install dependencies
      run: bash scripts/gha/deps_${{ matrix.targetos }}.sh
    - name: Build engine
      env:
        FWGS_PFX_PASSWORD: ${{ secrets.FWGS_PFX_PASSWORD }}
      run: bash scripts/gha/build_${{ matrix.targetos }}.sh
    - name: Upload engine (artifacts)
      uses: actions/upload-artifact@v7
      with:
        name: artifact-${{ matrix.targetos }}-${{ matrix.targetarch }}
        path: artifacts/*
  release:
    name: "Upload releases"
    runs-on: ubuntu-latest
    needs: [build]
    # Publishing creates (or moves) the release tag, and that tag push is a
    # push event - which would start this whole workflow again and create
    # another release on every single publication. Release tags still build,
    # they just never publish.
    if: ${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') }}
    permissions:
      contents: write
      actions: read
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Remove old release, fetch artifacts, repackage binaries and upload new release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        BASE_BUILDNUM_DATE: "2015-04-01"
        # This fork ships from feature/bhop-groundstrafe, not master, and the one
        # release players download is "continuous". Without pinning the tag every
        # build would publish to continuous-feature/bhop-groundstrafe and leave
        # "continuous" frozen on whatever it held when it was last touched.
        RELEASE_TAG_OVERRIDE: "continuous"
      run: bash scripts/gha/make_release.sh "Xash3D FWGS" "${{ github.ref_name }}"
